[/Script/Engine.InputSettings]
; Legacy axis/action mappings for the bootstrap ASeminolePlaceholderCharacter. UE5 projects
; default to the Enhanced Input classes; these two lines switch back to the classic ones so the
; mappings below are processed. Enhanced Input (Input Actions and Mapping Contexts under
; Content/) arrives with the first real character ticket.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+ActionMappings=(ActionName="Jump",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
; Interact (vertical slice part 1): search a container, deposit into the stockpile.
+ActionMappings=(ActionName="Interact",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=E)
