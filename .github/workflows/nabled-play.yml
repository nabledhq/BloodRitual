# Generated by nabled. Builds the default branch at the site root and every open pull request
# under pr-<number>/ in one GitHub Pages deployment, so backers can play a build before accepting
# it. Re-run "Update workflow & redeploy" in nabled to regenerate after changing settings.
name: nabled browser play

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main and every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: seminole
          DEFAULT_BRANCH: main
        run: |
          set -uo pipefail
          site="$RUNNER_TEMP/site"
          rm -rf "$site" && mkdir -p "$site"
          build_into() {
            # $1 = URL base path, $2 = destination directory
            export BASE="$1"
            rm -rf "dist"
            if ( set -e; npm ci && npm run build -- --base=$BASE ); then
              mkdir -p "$2" && cp -R "dist"/. "$2"/
              return 0
            fi
            return 1
          }
          git checkout -q "origin/$DEFAULT_BRANCH"
          build_into "/$SLUG/" "$site" || { echo "::error::build of $DEFAULT_BRANCH failed"; exit 1; }
          prs=$(gh pr list --state open --limit 50 --json number,headRefOid,headRefName)
          echo "$prs" | jq -c '.[]' | while read -r pr; do
            n=$(echo "$pr" | jq -r .number)
            if git fetch -q origin "pull/$n/head" && git checkout -q FETCH_HEAD; then
              if build_into "/$SLUG/pr-$n/" "$site/pr-$n"; then
                echo "preview for PR #$n built"
              else
                echo "::warning::preview build for PR #$n failed; skipping"
              fi
              git checkout -q "origin/$DEFAULT_BRANCH"
            fi
          done
          echo "$prs" | jq '[.[] | {number, sha: .headRefOid, branch: .headRefName, path: ("pr-" + (.number|tostring) + "/")}]' > "$site/previews.json"
          echo "built: $(ls "$site")"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
